<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact REPMAX — support, feedback, partnerships, and general contact.">
  <meta name="theme-color" content="#CCFF00">
  <meta property="og:title" content="Contact — REPMAX">
  <meta property="og:description" content="Get in touch with REPMAX for support, feedback, or partnerships.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.rep-max.app/contact">
  <link rel="canonical" href="https://www.rep-max.app/contact">
  <title>Contact — REPMAX</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .legal-page { max-width: 820px; margin: 0 auto; padding: 120px 24px 80px; color: var(--text-secondary); }
    .legal-page h1 { font-family: var(--font-display, 'Inter', sans-serif); font-size: 2.3rem; color: var(--text-primary, #fff); margin-bottom: 8px; }
    .legal-page .legal-updated { font-size: 0.8rem; color: var(--text-tertiary, #666); margin-bottom: 36px; text-transform: uppercase; letter-spacing: 0.08em; }
    .legal-page h2 { font-size: 1.2rem; color: var(--text-primary, #fff); margin: 32px 0 12px; }
    .legal-page p { font-size: 0.96rem; line-height: 1.8; margin-bottom: 12px; }
    .legal-page a { color: var(--accent, #D4FF00); text-decoration: none; }
    .legal-page a:hover { text-decoration: underline; }
    .legal-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary, #999); font-size: 0.85rem; text-decoration: none; margin-bottom: 24px; }
    .legal-back:hover { color: var(--text-primary, #fff); }
    .contact-grid { display: grid; gap: 16px; }
    .contact-card { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); border-radius: 18px; padding: 22px; }
    .contact-card h2 { margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="legal-page">
    <a href="/" class="legal-back">&larr; Back to REPMAX</a>
    <h1>Contact</h1>
    <p class="legal-updated">Support, partnerships, and feedback</p>

    <div class="contact-grid">
      <div class="contact-card">
        <h2>General contact</h2>
        <p><a href="mailto:hello@rep-max.app">hello@rep-max.app</a></p>
      </div>

      <div class="contact-card">
        <h2>Privacy and legal</h2>
        <p><a href="mailto:privacy@rep-max.app">privacy@rep-max.app</a></p>
      </div>

      <div class="contact-card">
        <h2>Community</h2>
        <p>Join the <a href="https://discord.gg/repmax" target="_blank" rel="noopener noreferrer">REPMAX Discord</a> if you want faster updates, feedback loops, or to get closer to the build.</p>
      </div>
    </div>
  </div>
</body>
</html>
