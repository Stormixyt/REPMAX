name: Build React Native iOS

on:
  workflow_dispatch:
  push:
    branches: [release/rn-ios]
    paths:
      - 'rn-app/**'
      - '.github/workflows/build-rn-ios.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Install dependencies
        working-directory: rn-app
        run: npm ci

      - name: Expo Prebuild
        working-directory: rn-app
        run: npx expo prebuild --platform ios --clean

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Packages
        working-directory: rn-app/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace REPMAX.xcworkspace \
            -scheme REPMAX \
            -destination "generic/platform=iOS" || echo "No swift packages to resolve"

      - name: Build app
        working-directory: rn-app/ios
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild archive \
            -workspace REPMAX.xcworkspace \
            -scheme REPMAX \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $PWD/build/REPMAX.xcarchive \
            -derivedDataPath $PWD/build/DerivedData \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/logs/xcodebuild.log

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-React-Native-iOS-xcode-log
          path: rn-app/ios/build/logs/xcodebuild.log
          retention-days: 14

      - name: Create unsigned IPA
        working-directory: rn-app/ios
        shell: bash
        run: |
          APP_PATH="build/REPMAX.xcarchive/Products/Applications/REPMAX.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not find REPMAX.app!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "App bundle size: $(du -sh "$APP_PATH" | cut -f1)"

          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" "build/ipa/Payload/REPMAX.app"
          cd build
          ditto -c -k --sequesterRsrc --keepParent ipa REPMAX.ipa
          echo "=== Final IPA size ==="
          du -h REPMAX.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-React-Native-iOS
          path: rn-app/ios/build/REPMAX.ipa
          retention-days: 90
