name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build REPMAX Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        working-directory: android-native
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-Native-Android
          path: android-native/app/build/outputs/apk/debug/*.apk
          retention-days: 90
