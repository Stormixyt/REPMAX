name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build REPMAX Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          echo "=== Looking for APK ==="
          find android-native/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found!"
          ls -la android-native/app/build/outputs/apk/debug/ || echo "Debug dir not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-Native-Android
          path: android-native/app/build/outputs/apk/debug/
          retention-days: 90
