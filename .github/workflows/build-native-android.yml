name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build REPMAX Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find android-native -name "*.apk" -type f 2>/dev/null
          echo "=== Creating output directory ==="
          mkdir -p apk-output
          find android-native -name "*.apk" -type f -exec cp {} apk-output/ \;
          echo "=== APK output contents ==="
          ls -la apk-output/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-Native-Android
          path: apk-output/
          if-no-files-found: warn
          retention-days: 90
