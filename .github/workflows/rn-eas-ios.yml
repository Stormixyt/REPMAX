name: RN iOS Build (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      wait_for_build:
        description: Wait for Expo to finish the build before this job exits
        required: true
        default: false
        type: boolean
  push:
    branches:
      - release/rn-ios
    paths:
      - 'rn-app/**'
      - '.github/workflows/rn-eas-ios.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Trigger RN iOS Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rn-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rn-app/package-lock.json

      - name: Validate required Expo secret
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN. Create an Expo personal access token and add it in the repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS project metadata
        run: |
          node -e "const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json','utf8')); const projectId=app?.expo?.extra?.eas?.projectId; if(!projectId){console.error('Missing expo.extra.eas.projectId in rn-app/app.json. Run `cd rn-app && eas build:configure` locally once, then commit the generated projectId.'); process.exit(1)} console.log('Using EAS projectId:', projectId)"

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode optional Apple API key
        if: ${{ secrets.EXPO_ASC_API_KEY_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eas"
          echo "${{ secrets.EXPO_ASC_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/eas/AuthKey.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/eas/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Trigger EAS iOS build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_WAIT_FOR_BUILD: ${{ github.event.inputs.wait_for_build }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          PROFILE="${INPUT_PROFILE:-preview}"
          WAIT_FLAG="--no-wait"

          if [ "${INPUT_WAIT_FOR_BUILD}" = "true" ]; then
            WAIT_FLAG="--wait"
          fi

          echo "Starting EAS iOS build with profile: $PROFILE"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            $WAIT_FLAG \
            --message "GitHub Actions run ${GITHUB_RUN_ID_VALUE} for ${GITHUB_SHA_VALUE}"

      - name: Write summary
        shell: bash
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_WAIT_FOR_BUILD: ${{ github.event.inputs.wait_for_build }}
        run: |
          PROFILE="${INPUT_PROFILE:-preview}"
          WAIT_MODE="${INPUT_WAIT_FOR_BUILD:-false}"
          {
            echo "## RN iOS build triggered"
            echo ""
            echo "- Profile: \`$PROFILE\`"
            echo "- Waited for completion: \`$WAIT_MODE\`"
            echo "- Repo path: \`rn-app/\`"
            echo ""
            echo "If this job used \`--no-wait\`, open the Expo build dashboard from the CLI link in the logs to monitor progress and download the IPA."
          } >> "$GITHUB_STEP_SUMMARY"
