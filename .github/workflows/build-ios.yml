name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [release/ios]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web assets
        working-directory: app
        run: npm run build

      - name: Verify dist output
        working-directory: app
        run: |
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== dist size ==="
          du -sh dist/
          test -f dist/index.html || (echo "ERROR: index.html missing" && exit 1)
          test -f dist/app.html || (echo "ERROR: app.html missing" && exit 1)

      - name: Sync Capacitor iOS
        working-directory: app
        run: npx cap sync ios

      - name: Verify web assets in iOS project
        run: |
          echo "=== iOS public dir ==="
          ls -la app/ios/App/App/public/
          echo "=== iOS public size ==="
          du -sh app/ios/App/App/public/
          test -f app/ios/App/App/public/index.html || (echo "ERROR: web assets not synced" && exit 1)

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Copy app icon
        working-directory: app/ios/App/App/Assets.xcassets/AppIcon.appiconset
        run: |
          # Use the 512px icon from web assets as the universal iOS app icon
          if [ -f "../../public/icon-512.png" ]; then
            cp ../../public/icon-512.png AppIcon-512@2x.png
            echo "Copied icon-512.png as app icon"
          fi

      - name: Resolve Swift packages
        working-directory: app/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS"

      - name: Build app
        working-directory: app/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath $PWD/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""

      - name: Create unsigned IPA
        working-directory: app/ios/App
        run: |
          # Find the built .app bundle
          APP_PATH=$(find build/DerivedData -name "App.app" -type d | grep -v "\.dSYM" | head -1)
          echo "Found app at: $APP_PATH"
          echo "App bundle size: $(du -sh "$APP_PATH" | cut -f1)"

          # List app contents to verify web assets are inside
          echo "=== App bundle contents ==="
          ls -la "$APP_PATH/"
          echo "=== public dir in bundle ==="
          ls "$APP_PATH/public/" 2>/dev/null | head -5 || echo "WARNING: no public dir in bundle"

          # Package as IPA
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../REPMAX.ipa Payload
          echo "=== Final IPA size ==="
          du -h ../REPMAX.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-iOS
          path: app/ios/App/build/REPMAX.ipa
          retention-days: 90
