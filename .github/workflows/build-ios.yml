name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [release/ios]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web assets
        working-directory: app
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: app
        run: npx cap sync ios

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        working-directory: app/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS"

      - name: Build Xcode archive
        working-directory: app/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO

      - name: Create unsigned IPA
        working-directory: app/ios/App
        run: |
          mkdir -p build/ipa/Payload
          # Find the .app in the archive
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../REPMAX.ipa Payload
          echo "IPA size: $(du -h ../REPMAX.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-iOS
          path: app/ios/App/build/REPMAX.ipa
          retention-days: 90
