name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [release/ios]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web assets
        working-directory: app
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: app
        run: npx cap sync ios

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Add Info.plist permissions
        working-directory: app/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'REPMAX needs camera access to scan food photos and barcodes'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'REPMAX needs photo library access to select food photos'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'REPMAX needs your location to track outdoor runs and find nearby gyms'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'REPMAX needs microphone access for voice and video calls'" Info.plist || true

      - name: Build Xcode archive
        working-directory: app/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcbeautify || tail -50

      - name: Create unsigned IPA
        working-directory: app/ios/App
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../REPMAX.ipa Payload
          echo "IPA size: $(du -h ../REPMAX.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPMAX-iOS
          path: app/ios/App/build/REPMAX.ipa
          retention-days: 90
